<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect TikTok · Agent HQ</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><div class="wrap"><section class="panel" style="max-width:640px;margin:40px auto">
<div class="label">Agent HQ · TikTok connection</div>
<h1 style="font-size:28px;margin:6px 0 10px">Almost done</h1>
<p class="muted">Copy this code and paste it into the connect script running on your laptop. It expires in a few minutes, so do it now.</p>
<pre id="code" style="white-space:pre-wrap;word-break:break-all;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px;font-family:var(--f-mono)">No code found in this link.</pre>
<button class="btn primary" id="copy" type="button">Copy code</button>
<p class="small" style="margin-top:14px">This page never sends the code anywhere. It only shows it to you.</p>
</section></div>
<script>
const q=new URLSearchParams(location.search);const c=q.get("code");const err=q.get("error_description")||q.get("error");
const box=document.getElementById("code");
if(c)box.textContent=c;else if(err)box.textContent="TikTok said: "+err;
// remove the code from the address bar after showing it
if(c||err)history.replaceState(null,"",location.pathname);
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(box.textContent);document.getElementById("copy").textContent="Copied"}catch{const r=document.createRange();r.selectNodeContents(box);getSelection().removeAllRanges();getSelection().addRange(r)}};
</script></body></html>
