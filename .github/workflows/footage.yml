name: Footage fetcher
on:
  push:
    branches: [main]
    paths: ["data/youtube/state.json"]
  schedule:
    - cron: "47 15 * * *"   # backup daily run, after the YouTube team
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch footage
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python collectors/footage.py
      - name: Save
        run: |
          git config user.name "agent-hq-footage"
          git config user.email "actions@users.noreply.github.com"
          git add data/youtube
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Footage fetcher: update clip status"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
